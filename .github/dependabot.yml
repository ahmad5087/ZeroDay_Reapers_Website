# Dependabot (Phase 14 — security). Weekly dependency + Actions update PRs for the main app, the
# portfolio app, and the workflows. Grouped so you get one PR per ecosystem instead of a flood.
# Enable "Dependabot alerts" + "security updates" in repo Settings → Code security (that part is manual).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      app-dependencies:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/portfolio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      portfolio-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
