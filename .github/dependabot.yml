# Weekly version updates for the main app, portfolio, and GitHub Actions.
# Routine npm updates are grouped, while major updates remain separate for review.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      app-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/portfolio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      portfolio-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["lucide-react"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
