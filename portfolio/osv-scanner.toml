ignoreUntil = 2026-12-31
reason = "picomatch ReDoS via single-branch repeated extglobs (DoS-only: CVSS A:H, no confidentiality/integrity impact). Affects every picomatch release through the current latest 4.0.7 with NO patched version published (advisory 2026-10-19), so there is no upgrade path. picomatch is a transitive build-/tooling-time glob matcher here, not compiled against attacker-controlled patterns at request time. Revisit by ignoreUntil or when a fixed picomatch ships."
