database_in=file:/var/lib/aide-zdr/aide.db
database_out=file:/var/lib/aide-zdr/aide.db.new
gzip_dbout=no
report_url=stdout
report_level=changed_attributes

ZDR = p+i+n+u+g+s+m+c+acl+xattrs+sha256+sha512

/etc/ssh ZDR
/etc/nftables\.conf$ ZDR
/etc/docker/daemon\.json$ ZDR
/etc/systemd/system ZDR
/srv/ops/[^/]+\.sh$ ZDR
/srv/ops/[^/]+\.env$ ZDR
/srv/ops/[^/]+/[^/]+\.(env|yaml|yml|conf)$ ZDR
