#!/usr/sbin/nft -f
# nftables.conf - host firewall for zdr-ops (ops monitor + backups). Single flat network; no honeypot.
# Default-drop inbound; only SSH and the gatus dashboard from the admin subnet are allowed. All the
# outbound the box needs (gatus checks, restic -> R2, Supabase) is permitted.
flush ruleset

define ADMIN_NET = 10.10.0.0/24   # subnet you administer the Pi from
define SSH_PORT  = 22

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif "lo" accept
    ct state invalid drop
    ip protocol icmp icmp type echo-request limit rate 5/second accept

    tcp dport $SSH_PORT ip saddr $ADMIN_NET accept   # admin SSH
    tcp dport 8080      ip saddr $ADMIN_NET accept   # gatus dashboard (optional)
  }

  # Default-drop forwarding, but let Docker containers (gatus) reach the internet.
  # Docker forwards container traffic through this hook; without these accepts it is dropped,
  # so every gatus check times out. Reloading this file flushes Docker's own rules too, so
  # run `systemctl restart docker` after `nft -f /etc/nftables.conf`.
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept   # return traffic for forwarded connections
    ip saddr $ADMIN_NET oifname "docker0" tcp dport 8080 accept  # admin -> gatus container
    iifname "docker0" accept             # container egress (gatus outbound checks)
  }
  chain output  { type filter hook output priority 0; policy accept; }
}
